# Development docker-compose for quick local testing.
# For production deployment with full monitoring stack,
# see deploy/docker/docker-compose.yml

version: '3.8'

services:
  gateway:
    build: .
    container_name: fingerprint-gateway
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - FP_HTTP_PORT=8080
      - FP_GRPC_PORT=9090
      - FP_LOG_LEVEL=debug
      - FP_RATE_LIMIT=1000
      - FP_CACHE_SIZE=10000
      - FP_CACHE_TTL=5m
    volumes:
      - ./data:/data
    networks:
      - fingerprint-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: fingerprint-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - fingerprint-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: fingerprint-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - fingerprint-net
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  fingerprint-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
