apiVersion: v1
kind: ConfigMap
metadata:
  name: fingerprint-config
  namespace: fingerprint
data:
  config.yaml: |
    server:
      http_port: 8080
      grpc_port: 9090
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 120s
    
    rate_limiter:
      enabled: true
      requests_per_second: 1000
      burst_size: 1500
    
    cache:
      enabled: true
      max_size: 10000
      ttl: 5m
      cleanup_interval: 1m
    
    connection_pool:
      max_size: 1000
      max_idle_time: 10m
      health_check_interval: 30s
    
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      timeout: 30s
      half_open_max_calls: 3
    
    metrics:
      enabled: true
      endpoint: "/metrics"
      retention: 24h
    
    ml:
      enabled: true
      model_path: "/data/models"
      prediction_cache_size: 5000
      min_confidence: 0.85
    
    tls:
      cipher_suites:
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
        - TLS_AES_128_GCM_SHA256
      min_version: "1.2"
    
    logging:
      level: info
      format: json
      output: stdout
