apiVersion: apps/v1
kind: Deployment
metadata:
  name: fingerprint-gateway
  namespace: fingerprint
  labels:
    app: fingerprint-gateway
    version: v3.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fingerprint-gateway
  template:
    metadata:
      labels:
        app: fingerprint-gateway
        version: v3.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: gateway
        image: vistone/fingerprint:v3.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 9090
          protocol: TCP
        env:
        - name: FP_HTTP_PORT
          value: "8080"
        - name: FP_GRPC_PORT
          value: "9090"
        - name: FP_LOG_LEVEL
          value: "info"
        - name: FP_RATE_LIMIT
          value: "1000"
        - name: FP_CACHE_SIZE
          value: "10000"
        - name: FP_ML_SERVICE_ENABLED
          value: "true"
        - name: FP_ML_INFERENCE_BACKEND
          value: "native"
        - name: FP_ML_CANARY_ENABLED
          value: "true"
        - name: FP_ML_CANARY_RATE
          value: "0.05"
        - name: FP_ML_CANARY_BACKEND
          value: "onnx"
        - name: FP_ML_ONNX_MODEL_DIR
          value: "/models/onnx"
        - name: FP_ML_SHADOW_COMPARE_ENABLED
          value: "true"
        - name: FP_ML_SHADOW_SAMPLE_RATE
          value: "0.1"
        - name: FP_ML_SHADOW_METRICS_PATH
          value: "/models/shadow_compare.jsonl"
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              fieldPath: limits.cpu
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /data
        - name: models
          mountPath: /models
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        emptyDir: {}
      - name: models
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - fingerprint-gateway
              topologyKey: kubernetes.io/hostname
