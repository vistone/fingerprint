apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fingerprint

resources:
- namespace.yaml
- configmap.yaml
- rbac.yaml
- deployment.yaml
- service.yaml
- hpa.yaml
- networkpolicy.yaml
- servicemonitor.yaml

commonLabels:
  app.kubernetes.io/name: fingerprint-gateway
  app.kubernetes.io/version: v3.0.0
  app.kubernetes.io/component: gateway
  app.kubernetes.io/part-of: fingerprint

images:
- name: vistone/fingerprint
  newTag: v3.0.0

replicas:
- name: fingerprint-gateway
  count: 3
