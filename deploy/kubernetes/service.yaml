apiVersion: v1
kind: Service
metadata:
  name: fingerprint-gateway
  namespace: fingerprint
  labels:
    app: fingerprint-gateway
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: grpc
    port: 9090
    targetPort: grpc
    protocol: TCP
  selector:
    app: fingerprint-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: fingerprint-gateway-external
  namespace: fingerprint
  labels:
    app: fingerprint-gateway
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: grpc
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: fingerprint-gateway
