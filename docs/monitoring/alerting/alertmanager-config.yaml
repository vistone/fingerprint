global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@example.com'
  smtp_auth_username: 'alerts@example.com'
  smtp_auth_password: '${SMTP_PASSWORD}'
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# 抑制规则 - 避免告警风暴
inhibit_rules:
  # 关键告警抑制警告
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'team']

  # 相同实例的告警抑制
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'critical'
    equal: ['instance']

# 路由树
route:
  group_by: ['alertname', 'severity', 'team']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # 安全团队路由
    - match:
        team: security
      receiver: 'security-team'
      group_by: ['alertname', 'risk_level']
      repeat_interval: 1h

    # 关键告警路由
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
      repeat_interval: 15m

    # 平台团队路由
    - match:
        team: platform
      receiver: 'platform-team'
      routes:
        - match:
            severity: info
          receiver: 'platform-oncall'
          continue: false

# 接收器配置
receivers:
  - name: 'default'
    email_configs:
      - to: 'oncall@example.com'
        subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Status: {{ .Status }}
          Starts at: {{ .StartsAt }}
          {{ end }}

  - name: 'security-team'
    slack_configs:
      - channel: '#security-alerts'
        username: 'Security Bot'
        icon_emoji: ':shield:'
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Risk Level:* {{ .Labels.risk_level }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        send_resolved: true
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SECURITY_KEY}'
        severity: '{{ .GroupLabels.severity }}'
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        details:
          firing: '{{ template "pagerduty.default.description" . }}'

  - name: 'critical-alerts'
    slack_configs:
      - channel: '#critical-alerts'
        username: 'Alert Manager'
        icon_emoji: ':fire:'
        title: ':rotating_light: CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Team:* {{ .Labels.team }}
          {{ end }}
        send_resolved: true
    pagerduty_configs:
      - service_key: '${PAGERDUTY_PLATFORM_KEY}'
        severity: critical
        description: '{{ .GroupLabels.alertname }}'

  - name: 'platform-team'
    slack_configs:
      - channel: '#platform-alerts'
        username: 'Platform Bot'
        icon_emoji: ':gear:'
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: true
    email_configs:
      - to: 'platform-team@example.com'
        subject: '[Platform Alert] {{ .GroupLabels.alertname }}'

  - name: 'platform-oncall'
    slack_configs:
      - channel: '@{{ .CommonLabels.oncall_user }}'
        username: 'OnCall Bot'
        title: '[{{ .Status }}] {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.summary }}'
