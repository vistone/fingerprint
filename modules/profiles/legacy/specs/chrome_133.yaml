# Chrome 133 指纹配置
# 该文件由代码生成工具读取，生成类型安全的 Go 代码

name: chrome_133
var_name: Chrome_133
display_name: Chrome 133
client: Chrome
version: "133"
random_extension_order: false

cipher_suites:
  - tls.GREASE_PLACEHOLDER
  - tls.TLS_AES_128_GCM_SHA256
  - tls.TLS_AES_256_GCM_SHA384
  - tls.TLS_CHACHA20_POLY1305_SHA256
  - tls.TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
  - tls.TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
  - tls.TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
  - tls.TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
  - tls.TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
  - tls.TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
  - tls.TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA
  - tls.TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA
  - tls.TLS_RSA_WITH_AES_128_GCM_SHA256
  - tls.TLS_RSA_WITH_AES_256_GCM_SHA384
  - tls.TLS_RSA_WITH_AES_128_CBC_SHA
  - tls.TLS_RSA_WITH_AES_256_CBC_SHA

compression_methods:
  - tls.CompressionNone

# TLS 扩展列表（按顺序）
extensions:
  - type: UtlsGREASEExtension
    params: {}
  
  - type: SessionTicketExtension
    params: {}
  
  - type: SignatureAlgorithmsExtension
    params:
      supported_signature_algorithms:
        - tls.ECDSAWithP256AndSHA256
        - tls.PSSWithSHA256
        - tls.PKCS1WithSHA256
        - tls.ECDSAWithP384AndSHA384
        - tls.PSSWithSHA384
        - tls.PKCS1WithSHA384
        - tls.PSSWithSHA512
        - tls.PKCS1WithSHA512
  
  - type: ApplicationSettingsExtensionNew
    params:
      supported_protocols:
        - "h3"
        - "h2"
  
  - type: KeyShareExtension
    params:
      key_shares:
        - group: tls.GREASE_PLACEHOLDER
          data: [0]
        - group: tls.X25519MLKEM768
        - group: tls.X25519
  
  - type: SCTExtension
    params: {}
  
  - type: SupportedPointsExtension
    params:
      supported_points:
        - tls.PointFormatUncompressed
  
  - type: SupportedVersionsExtension
    params:
      versions:
        - tls.GREASE_PLACEHOLDER
        - tls.VersionTLS13
        - tls.VersionTLS12
  
  - type: StatusRequestExtension
    params: {}
  
  - type: ALPNExtension
    params:
      alpn_protocols:
        - "h3"
        - "h2"
        - "http/1.1"
  
  - type: SNIExtension
    params: {}
  
  - type: BoringGREASEECH
    params: {}
  
  - type: UtlsCompressCertExtension
    params:
      algorithms:
        - tls.CertCompressionBrotli
  
  - type: SupportedCurvesExtension
    params:
      curves:
        - tls.GREASE_PLACEHOLDER
        - tls.X25519MLKEM768
        - tls.X25519
        - tls.CurveP256
        - tls.CurveP384
  
  - type: PSKKeyExchangeModesExtension
    params:
      modes:
        - tls.PskModeDHE
  
  - type: ExtendedMasterSecretExtension
    params: {}
  
  - type: RenegotiationInfoExtension
    params:
      renegotiation: tls.RenegotiateOnceAsClient
  
  - type: UtlsGREASEExtension
    params: {}

# HTTP/2 设置
settings:
  SettingHeaderTableSize: 65536
  SettingEnablePush: 0
  SettingInitialWindowSize: 6291456
  SettingMaxHeaderListSize: 262144

settings_order:
  - SettingHeaderTableSize
  - SettingEnablePush
  - SettingInitialWindowSize
  - SettingMaxHeaderListSize

# 伪头顺序
pseudo_header_order:
  - ":method"
  - ":authority"
  - ":scheme"
  - ":path"

# 连接流控制窗口
connection_flow: 15663105

# HTTP/2 优先级（可选）
# header_priority:
#   stream_dep: 0
#   exclusive: false
#   weight: 255
