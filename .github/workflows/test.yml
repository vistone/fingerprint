name: Tests and Benchmarks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: [ '1.25.4' ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Display Go version
      run: go version

    - name: Run tests with coverage
      run: go test ./... -v -coverprofile=coverage.out -covermode=atomic

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Run benchmarks
      run: go test ./test -bench=. -benchmem -run=^$ -timeout=30m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.4'
        cache: true

    - name: Build all packages
      run: go build ./...

    - name: Verify builds are reproducible
      run: |
        go build -o fingerprint.tmp ./examples/basic
        go build -o fingerprint.tmp ./examples/random
        go build -o fingerprint.tmp ./examples/simple
