version: "2"
run:
  issues-exit-code: 1
linters:
  default: all
  disable:
    - cyclop
    - gochecknoglobals
  settings:
    govet:
      disable:
        - composites  # 禁用对无键字段的检查，因为来自 utls 库
      enable-all: true
    funlen:
      lines: 80        # 单函数最大行数
      statements: 60   # 单函数最大语句数
    lll:
      line-length: 150  # 单行最大字符数
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: ^cmd/
        linters:
          - depguard
      - path: ^cmd/(collector|export_features|profilegen|train|validate|verify_weights)/
        linters:
          - exhaustruct
          - forbidigo
          - funlen
          - gocognit
          - goconst
          - gocritic
          - godot
          - govet
          - intrange
          - lll
          - maintidx
          - mnd
          - modernize
          - nlreturn
          - noinlineerr
          - prealloc
          - revive
          - tagliatelle
          - unused
          - varnamelen
          - wrapcheck
          - wsl
          - wsl_v5
    paths:
      - .*_test.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
      - ^cmd/compliance/
      - ^scripts/
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*_test.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
      - ^cmd/compliance/
      - ^scripts/
